<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#10243d" flood-opacity="0.18" />
    </filter>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfb15b" />
      <stop offset="100%" stop-color="#b98228" />
    </linearGradient>
  </defs>

  <!-- Tablet Outer Shell -->
  <rect x="30" y="30" width="680" height="520" rx="28" fill="#111820" filter="url(#shadow)" />
  <circle cx="370" cy="46" r="4" fill="#2d3748" />

  <!-- Screen Content -->
  <rect x="46" y="58" width="648" height="476" rx="16" fill="url(#screenGrad)" />

  <!-- Navigation Bar -->
  <g transform="translate(68, 80)">
    <!-- Brand Logo Mark -->
    <path d="M 0 10 Q 10 4 20 10 L 20 22 Q 10 16 0 22 Z" fill="#b98228" opacity="0.9"/>
    <path d="M 22 10 Q 32 4 42 10 L 42 22 Q 32 16 22 22 Z" fill="#b98228" opacity="0.9"/>
    <polygon points="21,2 23,7 28,7 24,10 26,15 21,12 16,15 18,10 14,7 19,7" fill="#dfb15b" />
    <text x="50" y="19" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#10243d">AnnGillette</text>

    <!-- Nav Links -->
    <text x="210" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#10243d">Home</text>
    <text x="280" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b">Practice</text>
    <text x="360" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b">Progress</text>
  </g>

  <line x1="46" y1="120" x2="694" y2="120" stroke="#e2e8f0" stroke-width="1" />

  <!-- Greeting -->
  <g transform="translate(68, 150)">
    <text x="0" y="16" font-family="Inter, sans-serif" font-size="22" font-weight="bold" fill="#10243d">Good morning, Alex</text>
    <text x="0" y="36" font-family="Inter, sans-serif" font-size="12" fill="#64748b">You have 1 recommended practice task due tomorrow.</text>
  </g>

  <!-- 3 Metric Cards -->
  <!-- Card 1: Practice Time -->
  <g transform="translate(68, 210)">
    <rect width="180" height="96" rx="14" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">PRACTICE TIME</text>
    <text x="16" y="60" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#10243d">3h 20m</text>
    <text x="16" y="80" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#10b981">this week</text>
  </g>

  <!-- Card 2: Questions Accuracy -->
  <g transform="translate(264, 210)">
    <rect width="180" height="96" rx="14" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">QUESTIONS</text>
    <text x="16" y="60" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#10243d">92%</text>
    <text x="16" y="80" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#10b981">accuracy</text>
  </g>

  <!-- Card 3: Current Streak -->
  <g transform="translate(460, 210)">
    <rect width="180" height="96" rx="14" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">CURRENT STREAK</text>
    <text x="16" y="60" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#b98228">7</text>
    <text x="36" y="60" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#64748b"> days</text>
    <text x="16" y="80" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#b98228">on fire 🔥</text>
  </g>

  <!-- Next Step Card -->
  <g transform="translate(68, 330)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.5">YOUR NEXT STEP</text>
    <rect y="12" width="572" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Hourglass circle icon -->
    <rect x="18" y="28" width="42" height="42" rx="10" fill="#e6f7f2" />
    <path d="M 33 42 L 45 42 L 39 49 L 45 56 L 33 56 L 39 49 Z" fill="#059669" />

    <text x="74" y="54" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#10243d">Algebra – Practice Set</text>
    <text x="74" y="70" font-family="Inter, sans-serif" font-size="11" fill="#64748b">10 questions · 15 mins</text>

    <!-- Start Button -->
    <rect x="470" y="30" width="84" height="38" rx="10" fill="#10243d" />
    <text x="498" y="54" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Start</text>
  </g>

  <!-- Phone Mockup on Right -->
  <g transform="translate(670, 90)" filter="url(#shadow)">
    <!-- Phone Bezel -->
    <rect width="250" height="460" rx="34" fill="#111820" stroke="#253142" stroke-width="3" />
    <rect x="8" y="8" width="234" height="444" rx="28" fill="#ffffff" />
    <!-- Dynamic Island / Speaker notch -->
    <rect x="85" y="16" width="80" height="18" rx="9" fill="#111820" />

    <!-- Topics Header -->
    <text x="24" y="68" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#10243d">Topics</text>

    <!-- Topic 1: Algebra -->
    <g transform="translate(24, 90)">
      <rect width="36" height="36" rx="8" fill="#fef3c7" />
      <text x="12" y="24" font-size="14">📐</text>
      <text x="46" y="18" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#10243d">Algebra</text>
      <rect x="46" y="24" width="130" height="6" rx="3" fill="#e2e8f0" />
      <rect x="46" y="24" width="112" height="6" rx="3" fill="#2aa88c" />
      <text x="184" y="29" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#2aa88c">88%</text>
    </g>

    <!-- Topic 2: English -->
    <g transform="translate(24, 142)">
      <rect width="36" height="36" rx="8" fill="#e0f2fe" />
      <text x="12" y="24" font-size="14">📖</text>
      <text x="46" y="18" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#10243d">English</text>
      <rect x="46" y="24" width="130" height="6" rx="3" fill="#e2e8f0" />
      <rect x="46" y="24" width="100" height="6" rx="3" fill="#2aa88c" />
      <text x="184" y="29" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#2aa88c">78%</text>
    </g>

    <!-- Topic 3: Reasoning -->
    <g transform="translate(24, 194)">
      <rect width="36" height="36" rx="8" fill="#f3e8ff" />
      <text x="12" y="24" font-size="14">🧩</text>
      <text x="46" y="18" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#10243d">Reasoning</text>
      <rect x="46" y="24" width="130" height="6" rx="3" fill="#e2e8f0" />
      <rect x="46" y="24" width="122" height="6" rx="3" fill="#2aa88c" />
      <text x="184" y="29" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#2aa88c">94%</text>
    </g>

    <!-- Topic 4: Biology -->
    <g transform="translate(24, 246)">
      <rect width="36" height="36" rx="8" fill="#fef3c7" />
      <text x="12" y="24" font-size="14">🧬</text>
      <text x="46" y="18" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#10243d">Biology</text>
      <rect x="46" y="24" width="130" height="6" rx="3" fill="#e2e8f0" />
      <rect x="46" y="24" width="116" height="6" rx="3" fill="#2aa88c" />
      <text x="184" y="29" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#2aa88c">90%</text>
    </g>

    <!-- Bottom Indicator -->
    <rect x="90" y="438" width="70" height="4" rx="2" fill="#cbd5e1" />
  </g>
</svg>
